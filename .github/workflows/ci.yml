name: KidneyVision CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # TEST JOB
  # ============================================================

  test:
    name: Run Tests

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx


      # --------------------------------------------------------
      # CREATE CI-ONLY SYNTHETIC DATASET
      # --------------------------------------------------------

      - name: Create CI test dataset
        run: |
          python tests/fixtures/create_ci_dataset.py


      # --------------------------------------------------------
      # GENERATE TRAIN / VALIDATION / TEST MANIFESTS
      # --------------------------------------------------------

      - name: Prepare CI dataset
        run: |
          python src/data/prepare_dataset.py


      # --------------------------------------------------------
      # VERIFY PROJECT STRUCTURE
      # --------------------------------------------------------

      - name: Verify project structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "API directory:"
          ls -la api

          echo ""
          echo "CI dataset:"
          ls -la data/raw/images/New\ folder9999

          echo ""
          echo "Generated manifests:"
          ls -la data/processed/manifests

          echo ""
          echo "Python version:"
          python --version


      # --------------------------------------------------------
      # RUN TESTS
      # --------------------------------------------------------

      - name: Run test suite
        run: |
          python -m pytest tests/ -v


  # ============================================================
  # DOCKER JOB
  # ============================================================

  docker:
    name: Build Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build -t kidneyvision-api:ci .