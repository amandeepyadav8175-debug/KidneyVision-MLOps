services:

  api:
    build: .
    container_name: kidneyvision-api
    ports:
      - "8000:8000"
    environment:
      MODEL_SOURCE: local
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: kidneyvision-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501