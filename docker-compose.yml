services:

  api:
    build: .
    container_name: kidneyvision-api

    ports:
      - "8000:8000"

    environment:
      MODEL_SOURCE: local

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3


  frontend:
    build: .
    container_name: kidneyvision-frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3